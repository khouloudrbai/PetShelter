<!DOCTYPE html>
<html>
<head>
    <title>Available Pets</title>
</head>
<body>
    <h1>Adoptable Pets</h1>
    <ul>
        {% for pet in pets %}
            <li>
                {{ pet.name }} - {{ pet.species }} ({{ pet.age }} years old)
                - <a href="{% url 'adopt-pet' pet.name %}">Adopt</a>
            </li>
        {% empty %}
            <li>No pets available for adoption right now.</li>
        {% endfor %}
    </ul>
</body>
</html>
